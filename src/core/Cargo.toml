[package]
name = "heap-visualizer-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "heap_visualizer_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
heap-visualizer-filter-dsl = { path = "../filter-dsl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
