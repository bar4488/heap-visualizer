# Serve the built site with the feature-request service beside it, on one
# origin (spec 11, D010).
#
#   ./build.sh                       # dist/ is built here, never in the image
#   HEAP_ADMIN_TOKEN=… docker compose up
#   http://localhost:8630            # the app
#   http://localhost:8630/admin      # the requests that came in
#
# dist/ is mounted read-only rather than copied: it is a build product, and
# rebuilding the web layer must not mean rebuilding an image. The service exits
# naming ./build.sh when it is not there.

services:
  web:
    build: .
    ports:
      - "${HEAP_PORT:-8630}:8630"
    volumes:
      - ./dist:/app/dist:ro
      - requests:/data
    environment:
      # `docker compose up` with nothing set is meant to work, so the default
      # is here — in the deploy config, where it is one line to override and
      # one line to read (T048). It is deliberately *not* in app.py: an unset
      # token there still means the review routes serve nothing (REQ-004),
      # which is what keeps a hand-run process from being open.
      #
      # It is a known string. Publishing this port on it publishes the
      # requests; set HEAP_ADMIN_TOKEN before doing that, and the service says
      # so on every start.
      HEAP_ADMIN_TOKEN: "${HEAP_ADMIN_TOKEN:-admin}"
    restart: unless-stopped

volumes:
  requests:
